# Put this file in your GitHub repo at:  .github/workflows/build-apk.yml
# The repo also needs rapidcyt.html in its root. Then: Actions tab -> "Build RapidCyt APK" -> Run workflow.
name: Build RapidCyt APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create Android project around rapidcyt.html
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @tensorflow/tfjs@4.15.0
          mkdir -p www
          cp rapidcyt.html www/index.html
          cp node_modules/@tensorflow/tfjs/dist/tf.min.js www/tf.min.js
          npx cap init "RapidCyt" "org.rapidcyt.pro" --web-dir www
          npx cap add android
          npx cap sync android
      - name: Camera permission
        run: sed -i '0,/<application/s##<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RapidCyt-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
